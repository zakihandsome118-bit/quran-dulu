<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <!-- Leather & Gold Gradients -->
    <linearGradient id="mushafCoverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D2314" />
      <stop offset="40%" stop-color="#26140A" />
      <stop offset="100%" stop-color="#150B05" />
    </linearGradient>

    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E7B9" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#AA7C11" />
      <stop offset="75%" stop-color="#E5C158" />
      <stop offset="100%" stop-color="#8F6308" />
    </linearGradient>

    <linearGradient id="goldShimmer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D1" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#C59E3F" stop-opacity="0.2" />
    </linearGradient>

    <radialGradient id="softGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E5C158" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#150B05" stop-opacity="0" />
    </radialGradient>

    <!-- Arabesque Pattern Def -->
    <pattern id="islamicLattice" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M20 0 L40 20 L20 40 L0 20 Z" fill="none" stroke="#D4AF37" stroke-width="0.75" stroke-opacity="0.18" />
      <circle cx="20" cy="20" r="6" fill="none" stroke="#D4AF37" stroke-width="0.75" stroke-opacity="0.2" />
      <path d="M0 0 L10 10 M30 10 L40 0 M0 40 L10 30 M30 30 L40 40" stroke="#D4AF37" stroke-width="0.5" stroke-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="400" rx="24" fill="url(#mushafCoverGrad)" />
  <rect width="800" height="400" rx="24" fill="url(#islamicLattice)" />
  <rect width="800" height="400" rx="24" fill="url(#softGlow)" />

  <!-- Outer Double Gilded Frame -->
  <rect x="14" y="14" width="772" height="372" rx="18" fill="none" stroke="url(#goldMetallic)" stroke-width="2.5" stroke-opacity="0.85" />
  <rect x="22" y="22" width="756" height="356" rx="14" fill="none" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="6,4" />

  <!-- Corner 1 (Top Left) -->
  <g transform="translate(24, 24)">
    <path d="M0 0 L45 0 C35 15 15 35 0 45 Z" fill="url(#goldMetallic)" fill-opacity="0.4" />
    <path d="M0 0 L55 0 C45 20 20 45 0 55 Z" fill="none" stroke="url(#goldMetallic)" stroke-width="1.5" />
    <circle cx="16" cy="16" r="3" fill="#FFF3D1" />
  </g>

  <!-- Corner 2 (Top Right) -->
  <g transform="translate(776, 24) scale(-1, 1)">
    <path d="M0 0 L45 0 C35 15 15 35 0 45 Z" fill="url(#goldMetallic)" fill-opacity="0.4" />
    <path d="M0 0 L55 0 C45 20 20 45 0 55 Z" fill="none" stroke="url(#goldMetallic)" stroke-width="1.5" />
    <circle cx="16" cy="16" r="3" fill="#FFF3D1" />
  </g>

  <!-- Corner 3 (Bottom Left) -->
  <g transform="translate(24, 376) scale(1, -1)">
    <path d="M0 0 L45 0 C35 15 15 35 0 45 Z" fill="url(#goldMetallic)" fill-opacity="0.4" />
    <path d="M0 0 L55 0 C45 20 20 45 0 55 Z" fill="none" stroke="url(#goldMetallic)" stroke-width="1.5" />
    <circle cx="16" cy="16" r="3" fill="#FFF3D1" />
  </g>

  <!-- Corner 4 (Bottom Right) -->
  <g transform="translate(776, 376) scale(-1, -1)">
    <path d="M0 0 L45 0 C35 15 15 35 0 45 Z" fill="url(#goldMetallic)" fill-opacity="0.4" />
    <path d="M0 0 L55 0 C45 20 20 45 0 55 Z" fill="none" stroke="url(#goldMetallic)" stroke-width="1.5" />
    <circle cx="16" cy="16" r="3" fill="#FFF3D1" />
  </g>

  <!-- Central Right Medallion Motif (Gilded Quran Artwork) -->
  <g transform="translate(620, 200)">
    <!-- Aura Rings -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4,6" />
    <circle cx="0" cy="0" r="115" fill="#2A170C" stroke="url(#goldMetallic)" stroke-width="2" />
    
    <!-- 8-Point Star Geometry -->
    <g stroke="url(#goldMetallic)" stroke-width="1.5" fill="none" opacity="0.85">
      <rect x="-70" y="-70" width="140" height="140" rx="8" transform="rotate(0)" />
      <rect x="-70" y="-70" width="140" height="140" rx="8" transform="rotate(45)" />
    </g>

    <!-- Inner Core & Calligraphy Stamp -->
    <circle cx="0" cy="0" r="62" fill="#1C0E06" stroke="url(#goldMetallic)" stroke-width="2" />
    <circle cx="0" cy="0" r="54" fill="none" stroke="#AA7C11" stroke-width="1" stroke-dasharray="2,3" />

    <!-- Stylized Arabic Calligraphy for "Al-Quran" -->
    <text x="0" y="16" font-family="'Amiri', 'Traditional Arabic', serif" font-size="52" font-weight="bold" fill="url(#goldMetallic)" text-anchor="middle" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.8))">
      القرآن
    </text>
    <text x="0" y="44" font-family="'Amiri', serif" font-size="20" font-weight="bold" fill="#F9E7B9" text-anchor="middle" opacity="0.9">
      الكريم
    </text>
  </g>

  <!-- Open Mushaf Silhouette & Rehal Artwork on the Right Background -->
  <g transform="translate(620, 310)" opacity="0.25">
    <!-- Wooden Rehal (X stand) -->
    <path d="M-80 50 L0 0 L80 50 M-60 55 L0 10 L60 55" stroke="url(#goldMetallic)" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
